version: "2"
run:
  go: "1.24"
  build-tags:
    - with_gvisor
    - with_quic
    - with_dhcp
    - with_wireguard
    - with_utls
    - with_acme
    - with_clash_api
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - paralleltest
    - staticcheck
  settings:
    govet:
      # 'inline' is a heuristic in govet (golangci-lint v2.12+) that
      # flags calls to generic stdlib helpers like slices.Equal because
      # the Go compiler does not yet inline functions whose type
      # parameters must be inferred from arguments. The reports are
      # informational ("waiting on the compiler"), not bugs in our
      # code, and they show up in third-party-style files we vendor
      # (e.g. common/ja3/ja3.go). Disable to keep CI signal useful.
      disable:
        - inline
    staticcheck:
      checks:
        - all
        - -S1000
        - -S1008
        - -S1017
        - -ST1003
        - -QF1001
        - -QF1003
        - -QF1008
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - transport/simple-obfs
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/sagernet/)
        - default
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - transport/simple-obfs
      - third_party$
      - builtin$
      - examples$
