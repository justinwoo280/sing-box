name: EWP CI

# Lightweight CI for the EWP fork: build the codebase with the
# standard matsuri build tags, run the EWP package tests, and run
# go vet on the EWP-specific packages. Runs on every push and PR
# regardless of branch — independent of the upstream build.yml /
# lint.yml gating so this fork's day-to-day work always gets exercised.

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ewp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.6
          cache: true

      - name: Resolve dependencies
        run: go mod download

      - name: Build (full matsuri tag set)
        run: |
          go build -v -trimpath \
            -tags 'with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale' \
            ./...

      - name: Test EWP packages
        run: |
          go test -v -count=1 -timeout=2m \
            -tags 'with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale' \
            ./protocol/ewp/...

      - name: Vet EWP packages
        run: |
          go vet \
            -tags 'with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale' \
            ./protocol/ewp/... ./option/... ./common/tls/...
